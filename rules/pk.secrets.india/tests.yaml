# Plinth rule pack source (K4 pk-rulepack/1.0). Authored in Stage 3 (2026-10-31).
# Compiled to packs/pk.secrets.india/ by the rule compiler. Edit only through a rule revision (rev + 1, changes entry).
# Secret-like inputs are split into input_parts so the repo never holds a whole token (GitHub push protection). Joined with no separator at test time.
spec: 'pk-rulepack/1.0'
pack_id: 'pk.secrets.india'
tests:
  - rule_id: 'pk.secret.razorpay.key_id_live'
    input_parts:
      - 'RAZORPAY_KEY_ID=rzp_'
      - 'live_'
      - 'ZivwLhHxCQ3xEr'
    expect: 'match'
  - rule_id: 'pk.secret.razorpay.key_id_live'
    input_parts:
      - 'rzp_'
      - 'live_'
      - 'f1N0WCaUgq'
    expect: 'no_match'
    note: 'too short'
  - rule_id: 'pk.secret.razorpay.key_id_test'
    input_parts:
      - 'key: rzp_'
      - 'test_'
      - 'HyT5qXV3nAokeR'
    expect: 'match'
  - rule_id: 'pk.secret.razorpay.key_id_test'
    input_parts:
      - 'rzp_'
      - 'demo_'
      - 'j24QiAxJiq47GU'
    expect: 'no_match'
    note: 'wrong mode word'
  - rule_id: 'pk.secret.razorpay.key_secret'
    input_parts:
      - 'key_id: rzp_'
      - 'live_'
      - 'ZivwLhHxCQ3xEr'
      - '

        key_secret: '
      - 'pGeYs7X4RBmgMTC2XcRR4L8h'
    expect: 'match'
  - rule_id: 'pk.secret.razorpay.key_secret'
    input_parts:
      - 'key_secret: '
      - 'pGeYs7X4RBmgMTC2XcRR4L8h'
    expect: 'no_match'
    note: 'no key ID nearby'
  - rule_id: 'pk.secret.cashfree.credential'
    input_parts:
      - 'x-client-secret: '
      - 'TEST'
      - 'orrs7XuL4Ip6VJANwOdrkF1dlCLxUegwK6Da0CHo'
    expect: 'match'
  - rule_id: 'pk.secret.cashfree.credential'
    input_parts:
      - 'TESTING_MODE_ENABLED_FOR_ALL_USERS in cashfree'
    expect: 'no_match'
    note: 'low-entropy words'
  - rule_id: 'pk.secret.msg91.authkey'
    input_parts:
      - 'MSG91 authkey: '
      - '31s7SXfLDtT0KuV6zs1kzCbf'
    expect: 'match'
  - rule_id: 'pk.secret.msg91.authkey'
    input_parts:
      - 'msg91 authkey: short1'
    expect: 'no_match'
    note: 'too short'
  - rule_id: 'pk.secret.zoho.oauth_token'
    input_parts:
      - 'Authorization: Zoho-oauthtoken 1000.'
      - '8e5121d0e74893b7dd17225e39c56f2d'
      - '.'
      - 'da5723ae0a0fd7f73e20f8e50cc5d526'
    expect: 'match'
  - rule_id: 'pk.secret.zoho.oauth_token'
    input_parts:
      - '1000.'
      - '40a5dddd4b93c18eabc8d5e8db6b3e4'
      - '.'
      - 'e193cc9afe84e86b0fb6b212b7bc2331'
    expect: 'no_match'
    note: 'first part one character short'
  - rule_id: 'pk.secret.instamojo.client_secret'
    input_parts:
      - 'instamojo client_secret='
      - 'Ik3kNo9JtnylBU2L0Bxy7Y8fsxLLJc4nFOWTMxp5U6ONT7N0UC4wvyWotfd2sjbMtAPssQiu8TAJW6DdukA1V7N3cSd9UK4zj6Y75NVOe41PRvgLQiDRL9N9y7r0UyzM'
    expect: 'match'
  - rule_id: 'pk.secret.instamojo.client_secret'
    input_parts:
      - 'client_secret='
      - '2v5iaFuW2JUJKhxkf057rNDZamcuJuHz2aJqmT3EORMc4wa2CdY4DaxHjrFTXIQ4RsSGkEFVoDhtMd5b6m9JV0D7N059JGlg4wtDzG6cb6iUlBvAuK1ccUTc0vwJU31x'
    expect: 'no_match'
    note: 'no instamojo keyword'
  - rule_id: 'pk.secret.instamojo.client_id'
    input_parts:
      - 'instamojo client_id='
      - '9ayQWxR1Xh1zCAOPcbNf50imFnMvkls6sT2Hax5w'
    expect: 'match'
  - rule_id: 'pk.secret.instamojo.client_id'
    input_parts:
      - 'instamojo commit '
      - '5ddf3738df4d199f61a4dc8a3c8af5bed55addaa'
    expect: 'no_match'
    note: 'git SHA-1 allow-listed'
