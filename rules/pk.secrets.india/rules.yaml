  - id: 'pk.secret.razorpay.key_secret'
    rev: 1
    status: 'experimental'
    verified:
      state: 'unverified'
      note: 'Key secret = 24 letters or digits found near a key ID (third-party detector fact); not yet checked against a real test-mode key.'
    source_refs:
      - source_id: 'leaksweep-research-2026-10-28'
        locator: '01-research.md section B1, Razorpay'
    effective_from: '2026-10-31'
    effective_until: '2026-11-25'
    changes:
      - rev: 1
        date: '2026-10-31'
        summary: 'First version (Plinth 0.1 Stage 3 plan).'
    tags:
      - 'secret'
      - 'razorpay'
    title: 'Razorpay key secret'
    description: 'A 24-character Razorpay key secret, reported only within 200 characters of a Razorpay key ID.'
    body:
      provider: 'razorpay'
      short: 'razorpay_key_secret'
      secret_kind: 'secret'
      environment: 'unknown'
      regex: '\b([0-9A-Za-z]{24})\b'
      secret_group: 1
      keywords:
        - 'rzp_'
      entropy_min: '3.5'
      pair_with:
        rules:
          - 'pk.secret.razorpay.key_id_live'
          - 'pk.secret.razorpay.key_id_test'
        within_chars: 200
      allow: []
      severity: 'critical'
      personal_data_reach: 'Customer names, e-mail addresses, phone numbers and payment records in the Razorpay account.'
      rotation_url: 'https://dashboard.razorpay.com/app/website-app-settings/api-keys'
