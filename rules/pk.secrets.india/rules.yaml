    effective_from: '2026-10-31'
    changes:
      - rev: 1
        date: '2026-10-31'
        summary: 'First version (Plinth 0.1 Stage 3 plan).'
    tags:
      - 'secret'
      - 'msg91'
    title: 'MSG91 auth key'
    description: 'MSG91 authkey value written after the word authkey.'
    body:
      provider: 'msg91'
      short: 'msg91_authkey'
      secret_kind: 'secret'
      environment: 'unknown'
      regex: '(?:authkey|msg91_auth_key|msg91-auth-key)[ \t"'':=]{1,5}([0-9A-Za-z]{20,40})'
      flags: 'i'
      secret_group: 1
      keywords:
        - 'authkey'
        - 'msg91'
      entropy_min: '3.0'
      allow: []
      severity: 'high'
      personal_data_reach: 'Sending SMS and OTP messages billed to the account; delivery reports with phone numbers.'
      rotation_url: 'https://control.msg91.com/'
