    title: 'Zoho OAuth access or refresh token'
    description: 'Zoho OAuth token: 1000. then 32 hex, a dot, and 32 hex.'
    body:
      provider: 'zoho'
      short: 'zoho_oauth_token'
      secret_kind: 'token'
      environment: 'live'
      regex: '\b(1000\.[0-9a-f]{32}\.[0-9a-f]{32})\b'
      secret_group: 1
      keywords:
        - '1000.'
      entropy_min: '3.0'
      allow: []
      severity: 'critical'
      personal_data_reach: 'Zoho CRM leads and contacts (names, e-mail addresses, phone numbers) within the token scope.'
      rotation_url: 'https://api-console.zoho.in/'
