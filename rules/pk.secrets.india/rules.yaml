  - id: 'pk.secret.cashfree.credential'
    rev: 1
    status: 'experimental'
    verified:
      state: 'unverified'
      note: 'Prefixes TEST (sandbox) and PROD (production) quoted from the Cashfree quickstart guide in the research; exact length unknown, so the rule is keyword-anchored.'
    source_refs:
      - source_id: 'leaksweep-research-2026-10-28'
        locator: '01-research.md section B2, Cashfree'
    effective_from: '2026-10-31'
    effective_until: '2026-11-25'
    changes:
      - rev: 1
        date: '2026-10-31'
        summary: 'First version (Plinth 0.1 Stage 3 plan).'
    tags:
      - 'secret'
      - 'cashfree'
    title: 'Cashfree app ID or secret key'
    description: 'Cashfree credential starting with TEST or PROD, reported only when the text mentions Cashfree or its x-client headers.'
    body:
      provider: 'cashfree'
      short: 'cashfree_credential'
      secret_kind: 'secret'
      environment: 'unknown'
      regex: '\b((?:TEST|PROD)[0-9A-Za-z_]{20,120})\b'
      secret_group: 1
      keywords:
        - 'cashfree'
        - 'x-client-secret'
        - 'x-client-id'
      entropy_min: '4.0'
      allow: []
      severity: 'critical'
      personal_data_reach: 'Payment and settlement records in the Cashfree account, including customer contact details.'
      rotation_url: 'https://merchant.cashfree.com/'
  - id: 'pk.secret.cashfree.credential'
    rev: 2
    status: 'stable'
    verified:
      state: 'verified'
      by: 'owner gate G-K5'
      at: '2026-11-25'
      note: 'Matched real test-mode client ID and secret formats from the provider dashboard after adjusting pattern and entropy threshold; value never stored.'
    source_refs:
      - source_id: 'leaksweep-research-2026-10-28'
        locator: '01-research.md section B2, Cashfree'
    effective_from: '2026-11-25'
    changes:
      - rev: 1
        date: '2026-10-31'
        summary: 'First version (Plinth 0.1 Stage 3 plan).'
      - rev: 2
        date: '2026-11-25'
        summary: 'Added cfsk_*_(test|prod)_* prefix, lowered entropy_min to 3.5 for hex keys, added cfsk_ keyword, and allow-listed all-caps TEST/PROD identifiers after gate G-K5.'
    tags:
      - 'secret'
      - 'cashfree'
    title: 'Cashfree app ID or secret key'
    description: 'Cashfree credential starting with TEST/PROD or cfsk_<module>_(test|prod)_, reported when Cashfree context or cfsk_ appears.'
    body:
      provider: 'cashfree'
      short: 'cashfree_credential'
      secret_kind: 'secret'
      environment: 'unknown'
      regex: '\b((?:TEST|PROD)[0-9A-Za-z_]{20,120}|cfsk_[a-z]{2,10}_(?:test|prod)_[0-9A-Za-z_]{20,120})\b'
      secret_group: 1
      keywords:
        - 'cashfree'
        - 'x-client-secret'
        - 'x-client-id'
        - 'cfsk_'
      entropy_min: '3.5'
      allow:
        - '^(?:TEST|PROD)[A-Z_]+$'
      severity: 'critical'
      personal_data_reach: 'Payment and settlement records in the Cashfree account, including customer contact details.'
      rotation_url: 'https://merchant.cashfree.com/'
  - id: 'pk.secret.msg91.authkey'
    rev: 1
    status: 'experimental'
