  - id: 'pk.secret.razorpay.key_id_live'
    rev: 1
    status: 'experimental'
    verified:
      state: 'unverified'
      note: 'Format recorded from a third-party detector (facts only, no code copied); not yet checked against Razorpay documentation or a real test-mode key.'
    source_refs:
      - source_id: 'leaksweep-research-2026-10-28'
        locator: '01-research.md section B1, Razorpay'
    effective_from: '2026-10-31'
    changes:
      - rev: 1
        date: '2026-10-31'
        summary: 'First version (Plinth 0.1 Stage 3 plan).'
    tags:
      - 'secret'
      - 'razorpay'
    title: 'Razorpay key ID (live)'
    description: 'Razorpay live key ID: rzp_live_ followed by 14 letters or digits. A public identifier, not a secret.'
    body:
      provider: 'razorpay'
      short: 'razorpay_key_id'
      secret_kind: 'public_id'
      environment: 'live'
      regex: '\brzp_live_[0-9A-Za-z]{14}\b'
      secret_group: 0
      keywords:
        - 'rzp_live_'
      allow: []
      severity: 'medium'
      personal_data_reach: 'Public identifier meant for checkout pages; on its own it reads nothing.'
      rotation_url: 'https://dashboard.razorpay.com/app/website-app-settings/api-keys'
