spec: 'pk-rulepack/1.0'
pack_id: 'pk.test.bad'
rules:
  - id: 'pk.pii.in.aadhaar'
    rev: 1
    status: 'experimental'
    verified:
      state: 'unverified'
      note: 'Fixture copy for compile-tests.'
    source_refs:
      - source_id: 'india-pii-structures'
        locator: 'aadhaar'
    effective_from: '2026-10-31'
    changes:
      - rev: 1
        date: '2026-10-31'
        summary: 'Fixture rule.'
    tags:
      - 'pii'
      - 'india'
    title: 'Aadhaar-like number'
    description: '12 digits, first digit 2-9, optional space or hyphen after each group of four, valid Verhoeff check digit.'
    body:
      pii_type: 'aadhaar'
      regex: '\b[2-9][0-9]{3}[ -]?[0-9]{4}[ -]?[0-9]{4}\b'
      validator: 'verhoeff'
      context_keywords:
        - 'aadhaar'
        - 'aadhar'
        - 'uidai'
        - 'uid'
      mask:
        store: 'never'
        display: 'none'
      severity: 'critical'
  - id: 'pk.pii.in.pan'
    rev: 1
    status: 'experimental'
    verified:
      state: 'unverified'
      note: 'Fixture copy for compile-tests.'
    source_refs:
      - source_id: 'india-pii-structures'
        locator: 'pan'
    effective_from: '2026-10-31'
    changes:
      - rev: 1
        date: '2026-10-31'
        summary: 'Fixture rule.'
    tags:
      - 'pii'
      - 'india'
    title: 'PAN (Permanent Account Number)'
    description: '5 letters, 4 digits, 1 letter; the 4th letter is the holder type.'
    body:
      pii_type: 'pan'
      regex: '\b[A-Z]{3}[ABCFGHJLPT][A-Z][0-9]{4}[A-Z]\b'
      validator: 'none'
      context_keywords:
        - 'pan'
      mask:
        store: 'masked'
        display: 'last4'
      severity: 'high'
  - id: 'pk.pii.in.mobile'
    rev: 1
    status: 'experimental'
    verified:
      state: 'unverified'
      note: 'Fixture copy for compile-tests.'
    source_refs:
      - source_id: 'india-pii-structures'
        locator: 'in_mobile'
    effective_from: '2026-10-31'
    changes:
      - rev: 1
        date: '2026-10-31'
        summary: 'Fixture rule.'
    tags:
      - 'pii'
      - 'india'
    title: 'Indian mobile number'
    description: '10 digits starting 6-9.'
    body:
      pii_type: 'in_mobile'
      regex: '(?:\+91[ -]?|\b0|\b)[6-9][0-9]{4}[ -]?[0-9]{5}\b'
      validator: 'none'
      context_keywords: []
      mask:
        store: 'masked'
        display: 'last4'
      severity: 'medium'
  - id: 'pk.pii.in.upi_id'
    rev: 1
    status: 'experimental'
    verified:
      state: 'unverified'
      note: 'Fixture copy for compile-tests.'
    source_refs:
      - source_id: 'india-pii-structures'
        locator: 'upi_id'
    effective_from: '2026-10-31'
    changes:
      - rev: 1
        date: '2026-10-31'
        summary: 'Fixture rule.'
    tags:
      - 'pii'
      - 'india'
    title: 'UPI ID (VPA)'
    description: 'name@handle where the handle is in the reference list of PSP handles.'
    body:
      pii_type: 'upi_id'
      regex: '\b[a-zA-Z0-9][a-zA-Z0-9._-]{1,255}@[a-zA-Z][a-zA-Z0-9]{1,63}\b'
      validator: 'upi_handle'
      context_keywords: []
      mask:
        store: 'masked'
        display: 'none'
      severity: 'medium'
      handles:
        - 'okaxis'
  - id: 'pk.pii.in.ifsc'
    rev: 1
    status: 'experimental'
    verified:
      state: 'unverified'
      note: 'Fixture copy for compile-tests.'
    source_refs:
      - source_id: 'india-pii-structures'
        locator: 'ifsc'
    effective_from: '2026-10-31'
    changes:
      - rev: 1
        date: '2026-10-31'
        summary: 'Fixture rule.'
    tags:
      - 'pii'
      - 'india'
    title: 'IFSC bank branch code'
    description: '4 letters, the digit 0, then 6 letters or digits.'
    body:
      pii_type: 'ifsc'
      regex: '\b[A-Z]{4}0[A-Z0-9]{6}\b'
      validator: 'none'
      context_keywords: []
      mask:
        store: 'masked'
        display: 'none'
      severity: 'low'
  - id: 'pk.pii.in.gstin'
    rev: 1
    status: 'experimental'
    verified:
      state: 'unverified'
      note: 'Fixture copy for compile-tests.'
    source_refs:
      - source_id: 'india-pii-structures'
        locator: 'gstin'
    effective_from: '2026-10-31'
    changes:
      - rev: 1
        date: '2026-10-31'
        summary: 'Fixture rule.'
    tags:
      - 'pii'
      - 'india'
    title: 'GSTIN'
    description: '15 characters with mod-36 check character.'
    body:
      pii_type: 'gstin'
      regex: '\b[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]\b'
      validator: 'gstin'
      context_keywords: []
      mask:
        store: 'masked'
        display: 'last4'
      severity: 'medium'
  - id: 'pk.pii.email'
    rev: 1
    status: 'experimental'
    verified:
      state: 'unverified'
      note: 'Fixture copy for compile-tests.'
    source_refs:
      - source_id: 'india-pii-structures'
        locator: 'email'
    effective_from: '2026-10-31'
    changes:
      - rev: 1
        date: '2026-10-31'
        summary: 'Fixture rule.'
    tags:
      - 'pii'
      - 'india'
    title: 'E-mail address'
    description: 'local@domain.tld with a 2-24 letter top-level domain.'
    body:
      pii_type: 'email'
      regex: '\b[a-zA-Z0-9._%+-]{1,64}@[a-zA-Z0-9.-]{1,253}\.[a-zA-Z]{2,24}\b'
      validator: 'none'
      context_keywords: []
      mask:
        store: 'masked'
        display: 'none'
      severity: 'medium'
