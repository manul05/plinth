spec: 'pk-rulepack/1.0'
pack_id: 'pk.test.bad'
tests:
  - rule_id: 'pk.pii.in.aadhaar'
    input_parts:
      - 'Aadhaar: 2949 1013 6515'
    expect: 'no_match'
    note: 'flipped expect from match to no_match to trigger PK_RULEPACK_TEST_FAILED'
  - rule_id: 'pk.pii.in.aadhaar'
    input_parts:
      - 'Aadhaar: 2949'
      - '10136515'
    expect: 'match'
    note: 'valid match test so rule has >= 1 match and >= 1 no_match'
  - rule_id: 'pk.pii.in.aadhaar'
    input_parts:
      - 'Aadhaar: 294910136516'
    expect: 'no_match'
  - rule_id: 'pk.pii.in.pan'
    input_parts:
      - 'PAN ABCPE1234F on file'
    expect: 'match'
  - rule_id: 'pk.pii.in.pan'
    input_parts:
      - 'code ABCXE1234F'
    expect: 'no_match'
  - rule_id: 'pk.pii.in.mobile'
    input_parts:
      - 'call +91 98765 43210'
    expect: 'match'
  - rule_id: 'pk.pii.in.mobile'
    input_parts:
      - 'order 5876543210'
    expect: 'no_match'
  - rule_id: 'pk.pii.in.upi_id'
    input_parts:
      - 'pay ramesh.k@okaxis today'
    expect: 'match'
  - rule_id: 'pk.pii.in.upi_id'
    input_parts:
      - 'ramesh@example'
    expect: 'no_match'
  - rule_id: 'pk.pii.in.ifsc'
    input_parts:
      - 'IFSC SBIN0001234'
    expect: 'match'
  - rule_id: 'pk.pii.in.ifsc'
    input_parts:
      - 'SBIN1001234'
    expect: 'no_match'
  - rule_id: 'pk.pii.in.gstin'
    input_parts:
      - 'GSTIN 29ABCDE1234F1ZW'
    expect: 'match'
  - rule_id: 'pk.pii.in.gstin'
    input_parts:
      - 'GSTIN 29ABCDE1234F1ZA'
    expect: 'no_match'
  - rule_id: 'pk.pii.email'
    input_parts:
      - 'mail priya.s@example.in'
    expect: 'match'
  - rule_id: 'pk.pii.email'
    input_parts:
      - 'priya.s@localhost'
    expect: 'no_match'
